spring.application.name=meu-financeiro
server.address=127.0.0.1
server.port=8080
# Reconhece o endereço HTTPS encaminhado pelo ngrok.
server.forward-headers-strategy=framework

# Banco salvo em arquivo: os registros continuam depois de fechar o programa.
spring.datasource.url=jdbc:h2:file:./data/financeiro
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Console web para consultar o banco durante a apresentação.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Entrega o frontend ao iniciar pela raiz do projeto ou pela pasta backend/.
spring.web.resources.static-locations=file:./frontend/src/,file:../frontend/src/

# Mostra detalhes das requisições HTTP no console
logging.level.root=INFO
logging.level.org.apache.coyote.http11.Http11InputBuffer=DEBUG
logging.level.org.springframework.web=DEBUG
